# Production overlay — fail-closed on every secret.
#
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# The base compose ships clearly-labeled `dev-insecure-*` fallbacks so local dev
# and CI work with zero setup. This overlay removes those fallbacks: every
# secret MUST be provided (via a root .env or the environment), or
# `docker compose config` fails before anything starts.
#
# See env.production.example for the full list and how to generate values.
services:
  # --- Shared app secrets. auth-api references all six, so gating them here
  #     fails the whole stack if any is unset. ---
  auth-api:
    environment:
      AUTH_JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?set JWT_ACCESS_SECRET in .env for production}
      AUTH_JWT_REFRESH_SECRET: ${AUTH_JWT_REFRESH_SECRET:?set AUTH_JWT_REFRESH_SECRET in .env for production}
      AUTH_INTERNAL_SERVICE_SECRET: ${INTERNAL_SERVICE_SECRET:?set INTERNAL_SERVICE_SECRET in .env for production}
      AUTH_INTERNAL_HMAC_SECRET: ${INTERNAL_HMAC_SECRET:?set INTERNAL_HMAC_SECRET in .env for production}
      BILLING_INTERNAL_SERVICE_SECRET: ${BILLING_INTERNAL_SERVICE_SECRET:?set BILLING_INTERNAL_SERVICE_SECRET in .env for production}
      BILLING_INTERNAL_HMAC_SECRET: ${BILLING_INTERNAL_HMAC_SECRET:?set BILLING_INTERNAL_HMAC_SECRET in .env for production}
      DB_PASS: ${AUTH_DB_PASSWORD:?set AUTH_DB_PASSWORD in .env for production}

  # --- Per-service database passwords (each gated on both the db and its api,
  #     so a mismatch can never ship). ---
  auth-db:
    environment:
      POSTGRES_PASSWORD: ${AUTH_DB_PASSWORD:?set AUTH_DB_PASSWORD in .env for production}

  billing-db:
    environment:
      POSTGRES_PASSWORD: ${BILLING_DB_PASSWORD:?set BILLING_DB_PASSWORD in .env for production}

  billing-api:
    environment:
      DB_PASSWORD: ${BILLING_DB_PASSWORD:?set BILLING_DB_PASSWORD in .env for production}

  vault-db:
    environment:
      POSTGRES_PASSWORD: ${VAULT_DB_PASSWORD:?set VAULT_DB_PASSWORD in .env for production}
      APP_DB_PASSWORD: ${VAULT_APP_DB_PASSWORD:?set VAULT_APP_DB_PASSWORD in .env for production}

  # --- Vault: app DB password, MinIO credentials, the shared ZT v1 HMAC secret,
  #     and the envelope-encryption master key (KEK). ---
  vault-api:
    environment:
      DB_PASSWORD: ${VAULT_APP_DB_PASSWORD:?set VAULT_APP_DB_PASSWORD in .env for production}
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER in .env for production}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env for production}
      ZT_HMAC_SECRET: ${ZT_HMAC_SECRET:?set ZT_HMAC_SECRET in .env for production}
      MASTER_KEY_B64: ${MASTER_KEY_B64:?set MASTER_KEY_B64 (vault KEK) in .env for production}

  # --- MinIO object storage root credentials. ---
  minio:
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER in .env for production}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env for production}

  minio-init:
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER in .env for production}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env for production}

  # --- Gateway: must share the same ZT v1 HMAC secret as vault-api. ---
  zerotrust-api:
    environment:
      ZT_HMAC_SECRET: ${ZT_HMAC_SECRET:?set ZT_HMAC_SECRET in .env for production}
#
# Asymmetric ZT signing (gateway->Vault) defaults to HMAC and needs no extra
# secrets to run. To flip to Ed25519 in production, provide in .env:
#   ZT_SIGN_MODE=ed25519
#   ZT_SIGNING_KID=<kid>                # e.g. zt-2026-08
#   ZT_SIGNING_PRIVATE_KEY=<base64 PEM>  # secret, zerotrust-api only
#   ZT_VERIFY_PUBLIC_KEYS={"<kid>":"<PEM public key>"}  # vault-api, non-secret
# The kid must match on both sides. Roll back by setting ZT_SIGN_MODE=hmac
# (no Vault redeploy). Retire HMAC later with ZT_ACCEPT_V1_HMAC=false.
