services:
  auth-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: auth
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5434:5432"
    volumes:
      - auth_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d auth"]
      interval: 5s
      timeout: 3s
      retries: 20

  billing-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: billing
      POSTGRES_USER: billing
      POSTGRES_PASSWORD: billing
    ports:
      - "5435:5432"
    volumes:
      - billing_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U billing -d billing"]
      interval: 5s
      timeout: 3s
      retries: 20

  vault-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: vault
      POSTGRES_USER: vault
      POSTGRES_PASSWORD: vault
      APP_DB_USER: ${VAULT_APP_DB_USER:-vault_app}
      APP_DB_PASSWORD: ${VAULT_APP_DB_PASSWORD:-vault_app}
    ports:
      - "5433:5432"
    volumes:
      - vault_postgres_data:/var/lib/postgresql/data
      - ./securechain-vault/infra/postgres/init:/docker-entrypoint-initdb.d:ro
      - ./securechain-vault/infra/postgres:/opt/securechain-postgres:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vault -d vault"]
      interval: 5s
      timeout: 3s
      retries: 20

  vault-db-upgrade:
    image: postgres:16-alpine
    profiles: ["tools"]
    depends_on:
      vault-db:
        condition: service_healthy
    environment:
      PGHOST: vault-db
      PGPORT: 5432
      PGDATABASE: vault
      PGUSER: vault
      PGPASSWORD: vault
      APP_DB_USER: ${VAULT_APP_DB_USER:-vault_app}
      APP_DB_PASSWORD: ${VAULT_APP_DB_PASSWORD:-vault_app}
    volumes:
      - ./securechain-vault/infra/postgres:/opt/securechain-postgres:ro
    command: ["/opt/securechain-postgres/apply-upgrades.sh"]

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio-init:
    image: minio/mc:latest
    restart: "no"
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set scv http://minio:9000 minioadmin minioadmin &&
      mc mb -p scv/vault || true &&
      mc anonymous set none scv/vault || true &&
      echo 'MinIO bucket ready: vault';
      "

  auth-api:
    build:
      context: ./auth/auth-api
    restart: unless-stopped
    depends_on:
      auth-db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3001
      DB_HOST: auth-db
      DB_PORT: 5432
      DB_NAME: auth
      DB_USER: postgres
      DB_PASS: postgres
      DB_SYNC: "false"
      AUTH_JWT_ISSUER: auth
      AUTH_JWT_AUDIENCE: zerotrust-api
      AUTH_JWT_ACCESS_SECRET: change-me-access-secret
      AUTH_JWT_REFRESH_SECRET: change-me-refresh-secret
      AUTH_JWT_ACCESS_EXPIRES_IN: 15m
      AUTH_JWT_REFRESH_EXPIRES_IN: 7d
      AUTH_BCRYPT_ROUNDS: 12
      AUTH_INTERNAL_SERVICE_SECRET: change-me-internal-secret
      AUTH_INTERNAL_HMAC_SECRET: change-me-internal-hmac-secret
      BILLING_METERING_BASE_URL: http://billing-api:3020/api
      BILLING_METERING_TIMEOUT_MS: 5000
      BILLING_INTERNAL_SERVICE_SECRET: change-me-billing-internal-secret
      BILLING_INTERNAL_HMAC_SECRET: change-me-billing-internal-hmac-secret
      AUTH_BOOTSTRAP_DEMO_DATA: "true"
      WEBAUTHN_RP_ID: localhost
      WEBAUTHN_RP_NAME: Sytadel
      WEBAUTHN_ORIGINS: "http://localhost:3003,http://localhost:4321"
      WEBAUTHN_CHALLENGE_TTL_MS: 300000
      WEBAUTHN_AUTHENTICATION_BEGIN_MIN_DURATION_MS: 250
      # M2 LLM anomaly classifier — value comes from the (gitignored) root .env.
      # Disabled by default; set ANOMALY_CLASSIFIER_ENABLED=true there to turn on.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      ANOMALY_CLASSIFIER_ENABLED: "true"
      # M2 slice 3 — AI-driven access review. Cron defaults to 03:15 UTC daily.
      ACCESS_REVIEW_ENABLED: "true"
    ports:
      - "3002:3001"

  vault-api:
    build:
      context: ./securechain-vault/vault-api
    restart: unless-stopped
    depends_on:
      vault-db:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_HOST: vault-db
      DB_PORT: 5432
      DB_NAME: vault
      DB_USER: ${VAULT_APP_DB_USER:-vault_app}
      DB_PASSWORD: ${VAULT_APP_DB_PASSWORD:-vault_app}
      STORAGE_DRIVER: minio
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET: vault
      MINIO_USE_SSL: "false"
      DOCS_MAX_FILE_SIZE_MB: 20
      DOCS_ALLOWED_MIME_TYPES: application/pdf,image/png,image/jpeg
      ZT_HMAC_SECRET: change_me_zt_secret
      ZT_MAX_CLOCK_SKEW_MS: 30000
      AUTH_DIRECTORY_BASE_URL: http://auth-api:3001/api
      AUTH_DIRECTORY_SERVICE_SECRET: change-me-internal-secret
      AUTH_DIRECTORY_HMAC_SECRET: change-me-internal-hmac-secret
      AUTH_DIRECTORY_TIMEOUT_MS: 5000
      MASTER_KEY_B64: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
      MASTER_KEY_VERSION: 1
    ports:
      - "3000:3000"

  zerotrust-api:
    build:
      context: ./ZeroTrust/zerotrust-api
    restart: unless-stopped
    depends_on:
      auth-api:
        condition: service_started
      vault-api:
        condition: service_started
    environment:
      NODE_ENV: production
      PORT: 3010
      ZT_JWT_ISSUER: auth
      ZT_JWT_AUDIENCE: zerotrust-api
      ZT_JWT_HS256_SECRET: change-me-access-secret
      ZT_HMAC_SECRET: change_me_zt_secret
      AUTH_DIRECTORY_BASE_URL: http://auth-api:3001/api
      AUTH_DIRECTORY_SERVICE_SECRET: change-me-internal-secret
      AUTH_DIRECTORY_HMAC_SECRET: change-me-internal-hmac-secret
      AUTH_DIRECTORY_TIMEOUT_MS: 5000
      BILLING_METERING_BASE_URL: http://billing-api:3020/api
      BILLING_METERING_TIMEOUT_MS: 5000
      BILLING_INTERNAL_SERVICE_SECRET: change-me-billing-internal-secret
      BILLING_INTERNAL_HMAC_SECRET: change-me-billing-internal-hmac-secret
      VAULT_BASE_URL: http://vault-api:3000
      ZT_POLICIES_FILE: /app/local/policies.json
      # M2 slice 2 — NL → RBAC policy generator. Key comes from the
      # (gitignored) root .env; set POLICY_GENERATOR_ENABLED=true there
      # to turn the endpoint on.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      POLICY_GENERATOR_ENABLED: "true"
    ports:
      - "3010:3010"

  billing-api:
    build:
      context: ./billing/billing-api
    restart: unless-stopped
    env_file:
      # Optional: real payment-provider secrets for local dev. Absent in CI —
      # billing-api boots from the `environment:` block below, which is why the
      # smoke stack must not fail when this file is missing.
      - path: ./billing/billing-api/.env
        required: false
    depends_on:
      billing-db:
        condition: service_healthy
      auth-api:
        condition: service_started
    environment:
      NODE_ENV: production
      PORT: 3020
      DB_HOST: billing-db
      DB_PORT: 5432
      DB_NAME: billing
      DB_USER: billing
      DB_PASSWORD: billing
      DB_SYNC: "false"
      BILLING_JWT_ISSUER: auth
      BILLING_JWT_AUDIENCE: zerotrust-api
      BILLING_JWT_ACCESS_SECRET: change-me-access-secret
      AUTH_DIRECTORY_BASE_URL: http://auth-api:3001/api
      AUTH_DIRECTORY_SERVICE_SECRET: change-me-internal-secret
      AUTH_DIRECTORY_HMAC_SECRET: change-me-internal-hmac-secret
      AUTH_DIRECTORY_TIMEOUT_MS: 5000
      BILLING_INTERNAL_SERVICE_SECRET: change-me-billing-internal-secret
      BILLING_INTERNAL_HMAC_SECRET: change-me-billing-internal-hmac-secret
      BILLING_ALLOW_MOCK_CHECKOUT_ACTIVATION: "true"
      BILLING_PORTAL_RETURN_URL: http://localhost:3003/app/billing
      BILLING_TRIAL_DAYS: 14
      BILLING_CLOSE_DUE_PERIODS_INTERVAL_MS: ${BILLING_CLOSE_DUE_PERIODS_INTERVAL_MS:-300000}
      MERCADOPAGO_API_BASE_URL: ${MERCADOPAGO_API_BASE_URL:-https://api.mercadopago.com}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
    ports:
      - "3020:3020"

  sytadel-web:
    build:
      context: ./sytadel-web
    restart: unless-stopped
    ports:
      - "4321:4321"

  sytadel-app:
    build:
      context: ./sytadel-app
    restart: unless-stopped
    depends_on:
      auth-api:
        condition: service_started
      billing-api:
        condition: service_started
      zerotrust-api:
        condition: service_started
    environment:
      NODE_ENV: production
      AUTH_API_URL: http://auth-api:3001/api
      BILLING_API_URL: http://billing-api:3020/api
      ZT_API_URL: http://zerotrust-api:3010
      VAULT_API_URL: http://vault-api:3000
    ports:
      - "3003:3003"

volumes:
  auth_postgres_data:
  billing_postgres_data:
  vault_postgres_data:
  minio_data:
